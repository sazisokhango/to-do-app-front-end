<div class="flex items-start gap-3 p-4 bg-white rounded-xl border-l-4 shadow-sm hover:shadow-md transition-shadow"
     [class]="priorityClasses()"
     [class.opacity-60]="todo().completed">

  <!-- Toggle button -->
  <button
    (click)="toggled.emit(todo().id)"
    class="mt-0.5 flex-shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors"
    [class.border-gray-300]="!todo().completed"
    [class.bg-blue-500]="todo().completed"
    [class.border-blue-500]="todo().completed"
    [title]="todo().completed ? 'Mark incomplete' : 'Mark complete'">
    @if (todo().completed) {
      <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
      </svg>
    }
  </button>

  <!-- Content -->
  <div class="flex-1 min-w-0">
    <div class="flex items-start justify-between gap-2">
      <p class="text-sm font-medium text-gray-800 truncate"
         [class.line-through]="todo().completed"
         [class.text-gray-400]="todo().completed">
        {{ todo().title }}
      </p>
      <span class="flex-shrink-0 text-xs font-semibold px-2 py-0.5 rounded-full" [class]="priorityBadgeClasses()">
        {{ todo().priority }}
      </span>
    </div>

    @if (todo().description) {
      <p class="text-xs text-gray-500 mt-0.5 line-clamp-2">{{ todo().description }}</p>
    }

    <div class="flex items-center justify-between mt-2">
      <span class="text-xs flex items-center gap-1"
            [class.text-red-500]="isOverdue()"
            [class.font-medium]="isOverdue()"
            [class.text-gray-400]="!isOverdue()">
        @if (isOverdue()) {
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          </svg>
          Overdue ·
        }
        {{ todo().dueDate }}
      </span>

      <div class="flex items-center gap-1">
        <button (click)="editRequested.emit(todo())"
          class="p-1.5 text-gray-400 hover:text-blue-500 hover:bg-blue-50 rounded-lg transition-colors" title="Edit">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
        </button>
        <button (click)="deleteRequested.emit(todo().id)"
          class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="Delete">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
