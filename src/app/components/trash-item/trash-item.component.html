<div class="flex items-start gap-3 p-4 bg-white rounded-xl border border-gray-100 shadow-sm opacity-75">

  <!-- Content -->
  <div class="flex-1 min-w-0">
    <div class="flex items-start justify-between gap-2">
      <p class="text-sm font-medium text-gray-500 truncate line-through">
        {{ todo().title }}
      </p>
      <span class="flex-shrink-0 text-xs font-semibold px-2 py-0.5 rounded-full" [class]="priorityBadgeClasses()">
        {{ todo().priority }}
      </span>
    </div>

    @if (todo().description) {
      <p class="text-xs text-gray-400 mt-0.5 line-clamp-1">{{ todo().description }}</p>
    }

    <div class="flex items-center justify-between mt-2">
      <div class="flex flex-col gap-0.5">
        <span class="text-xs text-gray-400">Due: {{ todo().dueDate }}</span>
        <span class="text-xs text-gray-400">Deleted: {{ formatDeletedAt() }}</span>
      </div>

      <button (click)="restoreRequested.emit(todo().id)"
        class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-green-700 bg-green-50 hover:bg-green-100 rounded-lg transition-colors"
        title="Restore">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
        </svg>
        Restore
      </button>
    </div>
  </div>
</div>
